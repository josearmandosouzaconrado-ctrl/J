# Gera o APK do jogo Unity "Frente Ocidental 1916" (pasta WW1Unity) e publica para download.
#
# Precisa de 3 segredos do repositório (Settings > Secrets and variables > Actions):
#   UNITY_EMAIL     e-mail da sua conta Unity (gratuita)
#   UNITY_PASSWORD  senha da conta Unity
#   UNITY_LICENSE   conteúdo do arquivo Unity_lic.ulf (gerado ao ativar a licença Personal no Unity Hub)
# Passo a passo em WW1Unity/README.md.

name: APK Frente Ocidental 1916

on:
  workflow_dispatch:
  push:
    paths:
      - "WW1Unity/**"
      - ".github/workflows/ww1-apk.yml"

permissions:
  contents: write

concurrency:
  group: ww1-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Liberar espaço em disco (a imagem do Unity é grande)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          tool-cache: false

      - uses: actions/checkout@v4

      - name: Verificar segredos da licença Unity
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ] || [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Faltam os segredos UNITY_EMAIL, UNITY_PASSWORD e/ou UNITY_LICENSE. Veja WW1Unity/README.md."
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: WW1Unity/Library
          key: ww1-library-android-${{ hashFiles('WW1Unity/Assets/**', 'WW1Unity/Packages/**', 'WW1Unity/ProjectSettings/**') }}
          restore-keys: ww1-library-android-

      - name: Build Unity (Android)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: WW1Unity
          targetPlatform: Android
          buildMethod: WW1.EditorTools.WW1Setup.BuildAndroidBatch
          versioning: None

      - name: Conferir APK
        run: ls -la WW1Unity/Builds/ && test -f WW1Unity/Builds/FrenteOcidental1916.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FrenteOcidental1916-apk
          path: WW1Unity/Builds/FrenteOcidental1916.apk

      - name: Publicar na página de Releases (download direto pelo celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ww1-apk
          name: Frente Ocidental 1916 (APK Android)
          prerelease: true
          make_latest: false
          body: |
            APK do jogo Unity **Frente Ocidental 1916** gerado automaticamente a partir do commit ${{ github.sha }}.
            Baixe o arquivo `FrenteOcidental1916.apk` abaixo no celular e instale (permita "fontes desconhecidas").
          files: WW1Unity/Builds/FrenteOcidental1916.apk
