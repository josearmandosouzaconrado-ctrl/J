# Compila o APK do jogo Frente Ocidental 1916 (pastas ww1/ e ww1-android/) com o Android SDK
# do GitHub e publica numa Release. Link fixo para baixar no celular:
#   https://github.com/josearmandosouzaconrado-ctrl/J/releases/download/frente-ocidental-1916/FrenteOcidental1916.apk
name: APK Frente Ocidental 1916
on:
  push:
    paths:
      - 'ww1/**'
      - 'ww1-android/**'
      - '.github/workflows/frente-ocidental-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: frente-ocidental-apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Chave de assinatura (opcional, segredo WW1_KEYSTORE_BASE64)
        env:
          KS: ${{ secrets.WW1_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/ww1.jks"; echo "KEYSTORE_FILE=$RUNNER_TEMP/ww1.jks" >> "$GITHUB_ENV"; fi

      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.WW1_KEYSTORE_PASSWORD }}
        run: gradle -p ww1-android assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: |
          ls -la ww1-android/app/build/outputs/apk/release/
          cp ww1-android/app/build/outputs/apk/release/app-release.apk FrenteOcidental1916.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FrenteOcidental1916
          path: FrenteOcidental1916.apk

      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=frente-ocidental-1916
          NOTAS="Frente Ocidental 1916 — jogo de tiro 3D da 1ª Guerra Mundial. Baixe FrenteOcidental1916.apk no celular Android (7.0 ou mais novo) e instale, permitindo instalar de fontes desconhecidas. Versão 1.0.${{ github.run_number }}, commit ${GITHUB_SHA::7}."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Frente Ocidental 1916 (APK Android)" --notes "$NOTAS" --latest=false
          else
            gh release edit "$TAG" --notes "$NOTAS"
          fi
          gh release upload "$TAG" FrenteOcidental1916.apk --clobber
