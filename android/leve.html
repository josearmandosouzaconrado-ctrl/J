<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140c1c">
<title>Crônicas de Eldoria</title>
<style>
@font-face{font-family:VT323;src:url(data:font/ttf;base64,/*FONTE*/) format('truetype')}
html,body{margin:0;height:100%;background:#140c24;color:#f2e6cc;font-family:VT323,monospace;overflow:hidden}
#leve{position:fixed;inset:0;overflow:hidden}
#leve canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.logo{position:absolute;left:0;right:0;top:5%;text-align:center;font-size:clamp(34px,7.5vw,72px);line-height:.9;color:#f0c040;text-shadow:3px 3px 0 #5a1a10,6px 6px 0 #000;letter-spacing:2px}
.logo small{display:block;font-size:.36em;color:#f2e6cc;letter-spacing:5px;text-shadow:2px 2px 0 #000;margin-top:4px}
.baixo{position:absolute;left:50%;bottom:max(12px,3%);transform:translateX(-50%);width:min(620px,88%);text-align:center}
#leve-msg{font-size:clamp(22px,3.6vw,30px);color:#ffe8a0;text-shadow:2px 2px 0 #000}
#leve-det{font-size:clamp(16px,2.6vw,20px);color:#e0d0b8;text-shadow:1px 1px 0 #000;min-height:1.2em;margin:2px 0 6px}
.barra{position:relative;height:18px;border:3px solid #c8a050;box-shadow:0 0 0 2px #2a1a10,inset 0 0 0 2px #000,0 4px 0 rgba(0,0,0,.5);background:#1a0e14;overflow:hidden}
#leve-fill{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(#ffe080,#f0b030 45%,#c07018);transition:transform .25s steps(6)}
.brilho{position:absolute;top:0;bottom:0;width:28%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:br 1.6s linear infinite}
@keyframes br{from{transform:translateX(-120%)}to{transform:translateX(420%)}}
#leve-pct{position:absolute;right:6px;top:-1px;font-size:16px;color:#fff;text-shadow:1px 1px 0 #000}
#leve-dica{margin-top:10px;font-size:clamp(15px,2.4vw,19px);color:#d8c8a8;background:rgba(10,6,16,.72);border:2px solid #5a4030;padding:6px 10px;min-height:2.4em}
#leve-dica b{color:#f0c040}
#leve-bt{margin-top:8px;font:inherit;font-size:20px;padding:6px 20px;background:#3a2a18;color:#ffd070;border:3px solid #c8a050;box-shadow:0 3px 0 #000}
</style>
</head>
<body>
<div id="leve"></div>
<script>
'use strict';
// =====================================================================
//  APK LEVE — o aplicativo traz só esta página. Na primeira vez que abre,
//  baixa o jogo completo do GitHub (código e imagens) e guarda no aparelho
//  (IndexedDB). Depois abre sem internet. Quando há internet, confere se há
//  versão nova e baixa só o que mudou; a novidade vale ao abrir de novo.
// =====================================================================
/*UNLZMA*/
(function () {
/*CENA*/
  const ADM = /*ADM*/false;
  const BASES = /*BASES*/['https://raw.githubusercontent.com/josearmandosouzaconrado-ctrl/J/HEAD/'];
  const $ = id => document.getElementById(id);
  // a tela: a mesma cena e a mesma barra do jogo (js/cena_carga.js)
  const montar = () => {
    const el = $('leve') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'leve' }));
    el.innerHTML = '<canvas></canvas><div class="logo">Crônicas de Eldoria<small>bem-vindo(a)!</small></div><div class="baixo"><div id="leve-msg">Preparando...</div><div id="leve-det"></div><div class="barra"><div id="leve-fill"></div><div class="brilho"></div><div id="leve-pct"></div></div><div id="leve-dica"></div><button id="leve-bt" style="display:none">Tentar de novo</button></div>';
    CenaCarga.animar(el.querySelector('canvas'));
    let i = Math.floor(Math.random() * DICAS_CARGA.length);
    const dica = () => { const d = $('leve-dica'); if (!d) return clearInterval(t); i = (i + 1) % DICAS_CARGA.length; d.innerHTML = '<b>Dica:</b> ' + DICAS_CARGA[i]; };
    const t = setInterval(dica, 5500); dica();
  };
  montar();
  const msg = (t, d) => { $('leve-msg').textContent = t; if (d !== undefined) $('leve-det').textContent = d; };
  const barra = k => { k = Math.max(0, Math.min(1, k)); $('leve-fill').style.transform = 'scaleX(' + k + ')'; $('leve-pct').textContent = Math.floor(k * 100) + '%'; };
  const kb = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB';
  // ---------- guardar no aparelho (IndexedDB; sem ele, só na memória) ----------
  let db = null; const mem = new Map();
  const abrirDB = () => new Promise(ok => { try { const r = indexedDB.open('eldoria_leve', 1); r.onupgradeneeded = () => r.result.createObjectStore('a'); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); r.onblocked = () => ok(null); } catch (e) { ok(null); } });
  const op = (modo, f) => new Promise(ok => { if (!db) return ok(undefined); try { const q = f(db.transaction('a', modo).objectStore('a')); q.onsuccess = () => ok(q.result); q.onerror = () => ok(undefined); } catch (e) { ok(undefined); } });
  const ler = async k => mem.has(k) ? mem.get(k) : op('readonly', s => s.get(k));
  const gravar = async (k, v) => { const r = db ? await op('readwrite', s => s.put(v, k)) : undefined; if (r === undefined) mem.set(k, v); };
  const apagar = k => { mem.delete(k); return op('readwrite', s => s.delete(k)); };
  const chaves = async () => (await op('readonly', s => s.getAllKeys())) || [];
  // ---------- internet ----------
  const pedir = async (p, comoJSON, prog) => {
    for (const b of BASES) {
      try {
        const r = await fetch(b + encodeURI(p), { cache: 'no-store' });
        if (!r.ok) continue;
        if (comoJSON) return await r.json();
        if (!r.body || !prog) return await r.arrayBuffer();
        const rd = r.body.getReader(), partes = []; let n = 0;
        for (;;) { const { done, value } = await rd.read(); if (done) break; partes.push(value); n += value.length; prog(n); }
        const u = new Uint8Array(n); let o = 0; for (const x of partes) { u.set(x, o); o += x.length; }
        return u.buffer;
      } catch (e) { /* tenta o próximo endereço */ }
    }
    return null;
  };
  const itens = m => m.arquivos.concat([ADM ? m.codigo_adm : m.codigo]);
  const chave = it => it.p + '@' + it.h;
  const completo = async m => { const K = new Set(await chaves()); for (const it of itens(m)) if (!K.has(chave(it)) && !mem.has(chave(it))) return false; return true; };
  // ---------- baixar a versão mais nova ----------
  async function atualizar(atual, primeira) {
    if (primeira) msg('Conectando...', '');
    const m = await pedir('leve/versao.json?t=' + Date.now(), true);
    if (!m || !m.codigo) { if (primeira) falhou('Sem internet', 'Na primeira vez o jogo precisa de internet para baixar (cerca de 4 MB). Depois ele abre sem internet.'); return; }
    if (!primeira && atual && atual.id === m.id) return;
    const K = new Set(await chaves());
    const faltam = itens(m).filter(it => !K.has(chave(it)) && !mem.has(chave(it)));
    const total = faltam.reduce((s, it) => s + it.tam, 0) || 1; let feito = 0;
    for (const it of faltam) {
      if (primeira) msg(atual ? 'Atualizando o jogo...' : 'Baixando o jogo (só na primeira vez)...', kb(feito) + ' de ' + kb(total));
      const buf = await pedir(it.p + '?h=' + it.h, false, n => { if (primeira) { barra((feito + n) / total); msg($('leve-msg').textContent, kb(feito + n) + ' de ' + kb(total)); } });
      if (!buf || buf.byteLength !== it.tam) { if (primeira) falhou('O download parou', 'A conexão caiu ou o jogo estava sendo atualizado. Tente de novo.'); return; }
      await gravar(chave(it), buf); feito += it.tam;
    }
    await gravar('_versao', m);
    const usar = new Set(itens(m).map(chave)); usar.add('_versao');
    for (const k of await chaves()) if (!usar.has(k)) await apagar(k);
    if (primeira) { barra(1); rodar(m); }
    else if (faltam.length && typeof Game !== 'undefined' && Game.toast) Game.toast('Atualização ' + m.v + ' baixada: vale na próxima vez que abrir o jogo.', '#a0ffa0');
  }
  function falhou(t, d) {
    msg(t, d); const b = $('leve-bt'); b.style.display = '';
    b.onclick = () => { b.style.display = 'none'; barra(0); iniciar(); };
  }
  const dataURL = (buf, tipo) => new Promise(ok => { const f = new FileReader(); f.onload = () => ok(f.result); f.onerror = () => ok(''); f.readAsDataURL(new Blob([buf], { type: tipo })); });
  // ---------- abrir o jogo ----------
  async function rodar(m) {
    msg('Abrindo o jogo...', 'versão ' + m.v);
    try {
      const mapa = {};
      for (const it of m.arquivos) mapa[it.p] = await dataURL(await ler(chave(it)), it.tipo);
      window.ARQ_LEVE = mapa;
      const st = document.createElement('style');
      st.textContent = m.css.replace(/url\(['"]?([^'")]+)['"]?\)/g, (a, u) => mapa['css/' + u] ? "url('" + mapa['css/' + u] + "')" : a);
      document.head.appendChild(st);
      const c = ADM ? m.codigo_adm : m.codigo;
      const o = unlzma(new Uint8Array(await ler(chave(c))), c.z), td = new TextDecoder('utf-8');
      $('leve').remove();
      document.body.insertAdjacentHTML('afterbegin', m.corpo);
      let p = 0;
      for (let i = 0; i < c.nomes.length; i++) {
        const e = document.createElement('script');
        e.text = td.decode(o.subarray(p, p + c.T[i])) + '\n//# sourceURL=' + c.nomes[i];
        p += c.T[i];
        document.head.appendChild(e);
      }
      window.dispatchEvent(new Event('load'));
      setTimeout(() => atualizar(m, false), 15000);
    } catch (e) {
      await apagar('_versao');
      document.body.innerHTML = ''; montar();
      falhou('Não foi possível abrir o jogo', String(e && e.message || e));
    }
  }
  async function iniciar() {
    if (!db) db = await abrirDB();
    const atual = await ler('_versao');
    if (atual && atual.codigo && await completo(atual)) return rodar(atual);
    await atualizar(atual, true);
  }
  iniciar();
})();
</script>
</body>
</html>
